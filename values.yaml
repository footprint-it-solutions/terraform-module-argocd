---
# This is the values file for the ArgoCD application. Use as follows:
# helm repo add argo https://argoproj.github.io/argo-helm
# helm repo update
# helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace --version 7.8.26 -f argocd/values.yaml

applicationSet:
  pdb:
    enabled: true
    minAvailable: 1
  replicas: ${applicationset_replicas}
  resources:
    limits:
      cpu: "${applicationset_cpu_lim}"
      memory: "${applicationset_mem_lim}"
    requests:
      cpu: "${applicationset_cpu_req}"
      memory: "${applicationset_mem_req}"
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-applicationset-controller

configs:
  cm:
    admin.enabled: true
    application.instanceLabelKey: argocd.argoproj.io/instance
    application.resourceTrackingMethod: annotation+label
    exec.enabled: "true"
    kustomize.buildOptions: --enable-helm
    # https://docs.crossplane.io/latest/guides/crossplane-with-argo-cd/
    resource.customizations: |
      "*.upbound.io/*":
        health.lua: |
          health_status = {
            status = "Progressing",
            message = "Provisioning ..."
          }

          local function contains (table, val)
            for i, v in ipairs(table) do
              if v == val then
                return true
              end
            end
            return false
          end

          local has_no_status = {
            "ClusterProviderConfig",
            "ProviderConfig",
            "ProviderConfigUsage"
          }

          if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
            health_status.status = "Healthy"
            health_status.message = "Resource is up-to-date."
            return health_status
          end

          if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
            if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
              health_status.status = "Healthy"
              health_status.message = "Resource is in use."
              return health_status
            end
            return health_status
          end

          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "LastAsyncOperation" then
              if condition.status == "False" then
                health_status.status = "Degraded"
                health_status.message = condition.message
                return health_status
              end
            end

            if condition.type == "Synced" then
              if condition.status == "False" then
                health_status.status = "Degraded"
                health_status.message = condition.message
                return health_status
              end
            end

            if condition.type == "Ready" then
              if condition.status == "True" then
                health_status.status = "Healthy"
                health_status.message = "Resource is up-to-date."
                return health_status
              end
            end
          end

          return health_status

      "*.crossplane.io/*":
        health.lua: |
          health_status = {
            status = "Progressing",
            message = "Provisioning ..."
          }

          local function contains (table, val)
            for i, v in ipairs(table) do
              if v == val then
                return true
              end
            end
            return false
          end

          local has_no_status = {
            "Composition",
            "CompositionRevision",
            "DeploymentRuntimeConfig",
            "ClusterProviderConfig",
            "ProviderConfig",
            "ProviderConfigUsage"
          }
          if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
              health_status.status = "Healthy"
              health_status.message = "Resource is up-to-date."
            return health_status
          end

          if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
            if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
              health_status.status = "Healthy"
              health_status.message = "Resource is in use."
              return health_status
            end
            return health_status
          end

          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "LastAsyncOperation" then
              if condition.status == "False" then
                health_status.status = "Degraded"
                health_status.message = condition.message
                return health_status
              end
            end

            if condition.type == "Synced" then
              if condition.status == "False" then
                health_status.status = "Degraded"
                health_status.message = condition.message
                return health_status
              end
            end

            if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) then
              if condition.status == "True" then
                health_status.status = "Healthy"
                health_status.message = "Resource is up-to-date."
                return health_status
              end
            end
          end

          return health_status
    resource.customizations.ignoreDifferences.all: |
      jsonPointers:
        - /spec/replicas
        - /spec/revisionHistoryLimit

    #  This instructs ArgoCD to exclude resources in the velero.io API group with kinds Backup and Restore from being managed by ArgoCD, for all clusters.
    resource.exclusions: |
      - apiGroups:
        - velero.io
        kinds:
        - Backup
        - Restore
        clusters:
        - "*"
      - apiGroups:
        - "*"
        kinds:
        - ManagedResourceDefinition
      - apiGroups:
        - "*"
        kinds:
        - ProviderConfigUsage
  rbac:
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
    # TODO: Add more roles, tighten up permissions
    # p, role:power_user, applications, *, */*, allow
    # p, role:power_user, applicationssets, *, */*, allow
    # p, role:power_user, clusters, get, *, allow
    # p, role:power_user, exec, create, */*, allow
    # p, role:power_user, extensions, invoke, */*, allow
    # p, role:power_user, logs, get, *, allow
    # p, role:power_user, projects, get, *, allow
    # p, role:power_user, repositories, *, allow
    policy.csv: |
      g, engineering, role:admin
    scopes: '[groups, email]'
  params:
    application.namespaces: "*"
    application.resourceTrackingMethod: "annotation"

# This is the Application Controller component of ArgoCD, which is responsible for reconciling the state of applications.
controller:
  env:
    - name: ARGOCD_K8S_CLIENT_QPS
      value: "${application_controller_qps}"
  pdb:
    enabled: true
    minAvailable: 1
  replicas: ${application_controller_replicas}
  resources:
    limits:
      cpu: "${application_controller_cpu_lim}"
      memory: "${application_controller_mem_lim}"
    requests:
      cpu: "${application_controller_cpu_req}"
      memory: "${application_controller_mem_req}"
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-application-controller

dex:
  enabled: false

global:
  affinity:
    podAntiAffinity: soft
  priorityClassName: system-cluster-critical

redis-ha:
  enabled: ${redis_ha_enabled}
  exporter:
    enabled: true
  haproxy:
    podDisruptionBudget:
      minAvailable: 1
  podDisruptionBudget:
    minAvailable: 2

repoServer:
  autoscaling:
    enabled: ${repo_server_autoscaling_enabled}
    minReplicas: ${repo_server_min_replicas}
    maxReplicas: ${repo_server_max_replicas}
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    limits:
      cpu: "${repo_server_cpu_lim}"
      memory: "${repo_server_mem_lim}"
    requests:
      cpu: "${repo_server_cpu_req}"
      memory: "${repo_server_mem_req}"
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server

server:
  autoscaling:
    enabled: ${server_autoscaling_enabled}
    minReplicas: ${server_min_replicas}
    maxReplicas: ${server_max_replicas}
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    limits:
      cpu: "${server_cpu_lim}"
      memory: "${server_mem_lim}"
    requests:
      cpu: "${server_cpu_req}"
      memory: "${server_mem_req}"
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
